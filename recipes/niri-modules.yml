modules:
  - type: dnf
    repos:
      copr:
        - errornointernet/quickshell
        - yalter/niri
    install:
      skip-unavailable: true
      packages:
        # Repo dependencies
        - terra-release
        # Niri ricing
        - mako
        - quickshell-git
        # Niri & dependencies
        - niri
        - xdg-desktop-portal-gtk
        - xdg-desktop-portal-gnome
        - gnome-keyring
        - xwayland-satellite
        - swww
        - swaylock
        - swayidle
        - fuzzel
        - qt6ct